<!DOCTYPE html>
<html lang="en">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #06060f;
      color: #e8e8f2;
      min-height: 100vh;
      display: flex;

      justify-content: center;

    }
    .card {

    }

      box-shadow: 0 0 32px rgba(99,102,241,0.25);
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.95rem;
      color: #8888aa;
      line-height: 1.7;
      max-width: 340px;
    }
    a {
      display: inline-block;
      margin-top: 8px;
      background: #6366f1;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 12px 28px;
      border-radius: 8px;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.85; }
    .note {
      font-size: 0.78rem;
      color: #4a4a6a;
      margin-top: 4px;

  <div class="card">

    <p>We're making improvements to ensure your portal meets our security standards. We'll be back shortly.</p>
    <p>If you need immediate access to your materials, please reach out directly.</p>
    <a href="mailto:andrei@novianintel.com">Contact Andrei</a>

  </div>
